set -g mouse on

set -g base-index 1

# clipboard
set -g set-clipboard on
set -g allow-passthrough on   # tmux 3.3+

# Bind Alt+number (M-1 to M-9) to select-window -t 1-9
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '~/.tmux/resurrect'

# tmux-continuum options
set -g @continuum-restore 'on'         # auto-restore last session on tmux start
set -g @continuum-save-interval '15'   # auto-save every 15 minutes

bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

# wsg wall integrations — `wsg.zsh` sets @wsg_launch_dir (window scope) and
# `-c $repo` (pane scope), enabling these context-aware bindings.
# Key choices: uppercase, avoiding TPM (I/U) and pain-control (H/J/K/L resize).
# - prefix+O: VSCode at super-repo (where you launched wsg wall)
# - prefix+G: GitHub web for the focused pane's repo on the CURRENT branch
#             (`gh browse` is branch-aware; detached → falls back to SHA)
# - prefix+Y: lazygit for the focused pane's repo (Y = "Yes git")
# - DoubleClick: VSCode at super-repo, but ONLY inside wsg-wall windows;
#                elsewhere fall back to tmux's default select-pane.
# O: VSCode at super-repo — guard with if-shell -F so non-wsg windows
#    show a hint instead of opening VSCode with empty path.
bind O if-shell -F '#{@wsg_launch_dir}' \
  'run-shell "code \"#{@wsg_launch_dir}\""' \
  'display-message "wsg: not in a wsg-wall window (@wsg_launch_dir unset)"'
# G: gh browse fails silently with run-shell, so chain || tmux display-message
#    to surface "no gh", "no GitHub remote", "not a git repo" etc.
bind G run-shell 'cd "#{pane_current_path}" && gh browse 2>/dev/null || tmux display-message "wsg: gh browse failed in #{pane_current_path}"'
bind Y new-window -c "#{pane_current_path}" 'lazygit'
bind -n DoubleClick1Pane if-shell -F '#{@wsg_launch_dir}' \
  'run-shell "code \"#{@wsg_launch_dir}\""' \
  'select-pane'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
